[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiver"
version = "2.0.0"
description = "fiver — terminal tool to control your Android phone from your computer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "fiver contributors" }]
keywords = ["android", "scrcpy", "adb", "mirror", "cli", "fiver"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = ["textual>=0.40.0", "qrcode>=7.0"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
fiver = "fiver.cli:main"

[project.urls]
Homepage = "https://github.com/Chintanpatel24/fiver"
Documentation = "https://github.com/Chintanpatel24/fiver#readme"
Issues = "https://github.com/Chintanpatel24/fiver/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fiver = ["py.typed", "companion/*.xml", "companion/*.java"]
